<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenedor de Productos - Lagarto Arcano</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/logo_lagarto.png">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos global -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Contenedor para Navbar Dinámica -->
    <div id="navbar-placeholder"></div>

    <!-- Encabezado de Sección -->
    <section class="category-header">
        <div class="container">
            <h1>Mantenedor de Productos</h1>
            <p>Sección exclusiva de administración. Registra nuevos juegos, modifica descripciones, ajusta ofertas y controla los niveles de inventario.</p>
        </div>
    </section>

    <!-- CRUD de Productos (Bootstrap 12-column grid) -->
    <main class="container-fluid px-md-5 my-5">
        <div class="row">
            
            <!-- Columna Izquierda: Formulario (col-12 col-lg-4) -->
            <div class="col-12 col-lg-4 mb-4">
                <div class="contact-card p-4">
                    <h3 class="mb-4 text-emerald" id="form-title" style="font-family: var(--font-heading);">Agregar Nuevo Juego</h3>
                    
                    <form id="form-producto" novalidate>
                        <!-- ID oculto para edición -->
                        <input type="hidden" id="product-id">

                        <!-- Campo: Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Juego *</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej. Catan" required>
                            <div class="error-feedback" id="error-nombre"></div>
                        </div>

                        <!-- Campo: Categoría -->
                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoría *</label>
                            <select id="categoria" class="form-select" required>
                                <option value="" disabled selected>Selecciona una categoría</option>
                                <option value="estrategia">Estrategia</option>
                                <option value="familiares">Familiares</option>
                                <option value="party">Party Games</option>
                                <option value="cooperativos">Cooperativos</option>
                            </select>
                            <div class="error-feedback" id="error-categoria"></div>
                        </div>

                        <!-- Campo: Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Breve Descripción *</label>
                            <textarea id="descripcion" class="form-control" placeholder="Describe brevemente las mecánicas del juego..." required style="min-height: 80px;"></textarea>
                            <div class="error-feedback" id="error-descripcion"></div>
                        </div>

                        <!-- Fila de Precio y Descuento -->
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="precio" class="form-label">Precio ($) *</label>
                                <input type="number" id="precio" class="form-control" placeholder="29990" min="0" required>
                                <div class="error-feedback" id="error-precio"></div>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="descuento" class="form-label">Descuento (%) *</label>
                                <input type="number" id="descuento" class="form-control" placeholder="0" min="0" max="100" required>
                                <div class="error-feedback" id="error-descuento"></div>
                            </div>
                        </div>

                        <!-- Fila de Stock e Imagen -->
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="stock" class="form-label">Inventario / Stock *</label>
                                <input type="number" id="stock" class="form-control" placeholder="10" min="0" required>
                                <div class="error-feedback" id="error-stock"></div>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label for="imagen" class="form-label">URL de Imagen *</label>
                                <input type="url" id="imagen" class="form-control" placeholder="https://images..." required>
                                <div class="error-feedback" id="error-imagen"></div>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-12 mb-2">
                                <button type="submit" id="btn-submit" class="btn btn-primary w-100 py-2 fs-5">Guardar Producto</button>
                            </div>
                            <div class="col-12">
                                <button type="button" id="btn-cancel" class="btn btn-secondary w-100 py-2 d-none">Cancelar Edición</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Columna Derecha: Inventario de Productos (col-12 col-lg-8) -->
            <div class="col-12 col-lg-8 mb-4">
                <div class="contact-card p-4">
                    <h3 class="mb-4 text-emerald" style="font-family: var(--font-heading);">Inventario de Juegos</h3>
                    
                    <div class="table-responsive" style="max-height: 560px; overflow-y: auto;">
                        <table class="table table-dark table-hover align-middle" style="font-size: 0.9rem;">
                            <thead>
                                <tr>
                                    <th scope="col">Miniatura</th>
                                    <th scope="col">Nombre</th>
                                    <th scope="col">Categoría</th>
                                    <th scope="col" class="text-end">Precio</th>
                                    <th scope="col" class="text-center">Desc.</th>
                                    <th scope="col" class="text-center">Stock</th>
                                    <th scope="col" class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-items-body">
                                <!-- Se inyectará dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Contenedor para Footer Dinámico -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica global y de admin -->
    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
