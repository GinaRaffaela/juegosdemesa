<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Arcanistas - Lagarto Arcano</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo_lagarto.png">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos global -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Contenedor para Navbar Dinámica -->
    <div id="navbar-placeholder"></div>

    <!-- Encabezado de Sección -->
    <section class="category-header">
        <div class="container">
            <h1>Registro de Arcanistas</h1>
            <p>Únete a nuestra cofradía lúdica. Regístrate para acumular recompensas estelares en tus compras y mantener un registro de tus tesoros de mesa preferidos.</p>
        </div>
    </section>

    <!-- Formulario de Registro (Bootstrap 5 Grid adaptativo) -->
    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="contact-card p-4 p-md-5">
                    <form id="form-registro" novalidate>
                        <div class="row">
                            
                            <!-- Campo: Nombre Completo -->
                            <div class="col-12 col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre Completo *</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Ej. Matías Ignacio Pérez" required autocomplete="name">
                                <div class="error-feedback" id="error-nombre"></div>
                            </div>

                            <!-- Campo: Nombre de Usuario -->
                            <div class="col-12 col-md-6 mb-3">
                                <label for="usuario" class="form-label">Nombre de Usuario *</label>
                                <input type="text" id="usuario" class="form-control" placeholder="Ej. matilizard" required autocomplete="username">
                                <div class="error-feedback" id="error-usuario"></div>
                            </div>

                            <!-- Campo: Correo Electrónico -->
                            <div class="col-12 col-md-6 mb-3">
                                <label for="email" class="form-label">Correo Electrónico *</label>
                                <input type="email" id="email" class="form-control" placeholder="arcanista@correo.com" required autocomplete="email">
                                <div class="error-feedback" id="error-email"></div>
                            </div>

                            <!-- Campo: Rol de Usuario (Requisito de Roles) -->
                            <div class="col-12 col-md-6 mb-3">
                                <label for="rol" class="form-label">Tipo de Usuario / Rol *</label>
                                <select id="rol" class="form-select" required>
                                    <option value="" disabled selected>Selecciona tu rol</option>
                                    <option value="cliente">Cliente (Comprador de Juegos)</option>
                                    <option value="administrador">Administrador (Gestión de Tienda)</option>
                                </select>
                                <div class="error-feedback" id="error-rol"></div>
                            </div>

                            <!-- Campo: Contraseña -->
                            <div class="col-12 col-md-6 mb-3">
                                <label for="password" class="form-label">Contraseña *</label>
                                <input type="password" id="password" class="form-control" placeholder="Mín 8-20 carac, 1 Mayús, 1 Num, 1 Esp (@$!%*?&)" required autocomplete="new-password">
                                <div class="error-feedback" id="error-password"></div>
                            </div>
                            
                            <!-- Campo: Repetir Contraseña -->
                            <div class="col-12 col-md-6 mb-3">
                                <label for="confirm-password" class="form-label">Repetir Contraseña *</label>
                                <input type="password" id="confirm-password" class="form-control" placeholder="Repite exactamente tu clave" required autocomplete="new-password">
                                <div class="error-feedback" id="error-confirm-password"></div>
                            </div>

                            <!-- Campo: Fecha de Nacimiento -->
                            <div class="col-12 col-md-6 mb-3">
                                <label for="fecha-nacimiento" class="form-label">Fecha de Nacimiento * (Mín. 13 años)</label>
                                <input type="date" id="fecha-nacimiento" class="form-control" required>
                                <div class="error-feedback" id="error-fecha-nacimiento"></div>
                            </div>
                            
                            <!-- Campo: Dirección de despacho -->
                            <div class="col-12 col-md-6 mb-4">
                                <label for="direccion" class="form-label">Dirección de Despacho (Opcional)</label>
                                <input type="text" id="direccion" class="form-control" placeholder="Ej. Calle 1 Oriente 406, Viña del Mar" autocomplete="street-address">
                                <div class="error-feedback" id="error-direccion"></div>
                            </div>

                        </div>

                        <!-- Botones de Acción -->
                        <div class="row mt-3">
                            <div class="col-12 col-md-6 mb-2">
                                <button type="submit" id="btn-submit" class="btn btn-primary w-100 py-2 fs-5" disabled>Completar Registro</button>
                            </div>
                            <div class="col-12 col-md-6 mb-2">
                                <button type="reset" id="btn-reset" class="btn btn-secondary w-100 py-2 fs-5">Limpiar Formulario</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Contenedor para Footer Dinámico -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica global y de registro -->
    <script src="js/main.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
