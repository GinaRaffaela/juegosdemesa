<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Lagarto Arcano</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo_lagarto.png">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos global -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Contenedor para Navbar Dinámica -->
    <div id="navbar-placeholder"></div>

    <!-- Sección de Login (Diseño adaptativo de Bootstrap) -->
    <main class="container my-5 py-5 d-flex justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="contact-card p-4 p-md-5">
                    <h2 class="section-title mb-4">Iniciar Sesión</h2>
                    
                    <form id="form-login" novalidate>
                        <!-- Campo: Usuario o Correo -->
                        <div class="mb-3">
                            <label for="identificador" class="form-label">Nombre de Usuario o Email *</label>
                            <input type="text" id="identificador" class="form-control" placeholder="Ej: admin o cliente@gmail.com" required autocomplete="username">
                            <div class="error-feedback" id="error-identificador"></div>
                        </div>

                        <!-- Campo: Contraseña -->
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña *</label>
                            <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                            <div class="error-feedback" id="error-password"></div>
                        </div>

                        <!-- Botón Submit -->
                        <button type="submit" class="btn btn-primary w-100 py-2 fs-5 mb-3">Iniciar Sesión</button>
                    </form>

                    <!-- Alerta de feedback general de error -->
                    <div class="alert alert-danger d-none" id="alert-error-login" role="alert">
                        Usuario o contraseña incorrectos. Por favor, verifica tus datos.
                    </div>

                    <!-- Enlaces Adicionales -->
                    <div class="text-center mt-3 fs-6">
                        <p class="mb-1 text-muted">¿No tienes cuenta? <a href="registro.html" class="text-emerald fw-bold">Regístrate aquí</a></p>
                        <p class="mb-0"><a href="recuperar.html" class="text-warning">¿Olvidaste tu contraseña?</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Contenedor para Footer Dinámico -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica global y de login -->
    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
