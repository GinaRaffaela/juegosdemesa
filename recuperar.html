<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Lagarto Arcano</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo_lagarto.png">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos global -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Contenedor para Navbar Dinámica -->
    <div id="navbar-placeholder"></div>

    <!-- Sección de Recuperar Contraseña -->
    <main class="container my-5 py-5 d-flex justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="contact-card p-4 p-md-5">
                    <h2 class="section-title mb-4">Recuperar Clave</h2>
                    <p class="text-muted text-center mb-4">Ingresa tu correo electrónico registrado. Te enviaremos un pergamino digital con instrucciones para restablecer tu clave.</p>
                    
                    <form id="form-recuperar" novalidate>
                        <!-- Campo: Email -->
                        <div class="mb-4">
                            <label for="email" class="form-label">Correo Electrónico *</label>
                            <input type="email" id="email" class="form-control" placeholder="arcanista@correo.com" required autocomplete="email">
                            <div class="error-feedback" id="error-email"></div>
                        </div>

                        <!-- Botón Submit -->
                        <button type="submit" class="btn btn-primary w-100 py-2 fs-5 mb-3">Enviar Enlace</button>
                    </form>

                    <!-- Alertas de feedback -->
                    <div class="alert alert-success d-none" id="alert-success-recuperar" role="alert">
                        <strong>¡Enlace Enviado!</strong> Si el correo está registrado, recibirás un mensaje mágico a la brevedad.
                    </div>
                    <div class="alert alert-danger d-none" id="alert-error-recuperar" role="alert">
                        El formato de correo no es válido.
                    </div>

                    <!-- Enlaces Adicionales -->
                    <div class="text-center mt-3 fs-6">
                        <p class="mb-0"><a href="login.html" class="text-emerald fw-bold">Volver al Inicio de Sesión</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Contenedor para Footer Dinámico -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica global y de recuperar -->
    <script src="js/main.js"></script>
    <script src="js/recuperar.js"></script>
</body>
</html>
