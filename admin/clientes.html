<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenedor de Clientes - Lagarto Arcano</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/logo_lagarto.png">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos global -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Contenedor para Navbar Dinámica -->
    <div id="navbar-placeholder"></div>

    <!-- Encabezado de Sección -->
    <section class="category-header">
        <div class="container">
            <h1>Mantenedor de Clientes y Usuarios</h1>
            <p>Sección de administración. Revisa el registro de compradores de la cofradía, gestiona credenciales de acceso y asigna roles del sistema.</p>
        </div>
    </section>

    <!-- CRUD de Clientes (Bootstrap 12-column grid) -->
    <main class="container-fluid px-md-5 my-5">
        <div class="row">
            
            <!-- Columna Izquierda: Formulario (col-12 col-lg-4) -->
            <div class="col-12 col-lg-4 mb-4">
                <div class="contact-card p-4">
                    <h3 class="mb-4 text-emerald" id="form-title" style="font-family: var(--font-heading);">Agregar Cuenta</h3>
                    
                    <form id="form-cliente" novalidate>
                        <!-- Modo del formulario (add / edit) -->
                        <input type="hidden" id="form-mode" value="add">

                        <!-- Campo: Nombre Completo -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo *</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
                            <div class="error-feedback" id="error-nombre"></div>
                        </div>

                        <!-- Campo: Nombre de Usuario -->
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Nombre de Usuario *</label>
                            <input type="text" id="usuario" class="form-control" placeholder="Ej. cliente123" required>
                            <div class="error-feedback" id="error-usuario"></div>
                        </div>

                        <!-- Campo: Correo Electrónico -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico *</label>
                            <input type="email" id="email" class="form-control" placeholder="cliente@correo.com" required>
                            <div class="error-feedback" id="error-email"></div>
                        </div>

                        <!-- Campo: Rol -->
                        <div class="mb-3">
                            <label for="rol" class="form-label">Rol del Usuario *</label>
                            <select id="rol" class="form-select" required>
                                <option value="" disabled selected>Selecciona un rol</option>
                                <option value="cliente">Cliente (Comprador)</option>
                                <option value="administrador">Administrador</option>
                            </select>
                            <div class="error-feedback" id="error-rol"></div>
                        </div>

                        <!-- Campo: Contraseña -->
                        <div class="mb-3">
                            <label for="password" class="form-label" id="label-password">Contraseña *</label>
                            <input type="password" id="password" class="form-control" placeholder="Contraseña segura" required>
                            <div class="error-feedback" id="error-password"></div>
                        </div>

                        <!-- Campo: Fecha de Nacimiento -->
                        <div class="mb-3">
                            <label for="fecha-nacimiento" class="form-label">Fecha de Nacimiento * (Mín. 13 años)</label>
                            <input type="date" id="fecha-nacimiento" class="form-control" required>
                            <div class="error-feedback" id="error-fecha-nacimiento"></div>
                        </div>
                        
                        <!-- Campo: Dirección de despacho -->
                        <div class="mb-4">
                            <label for="direccion" class="form-label">Dirección (Opcional)</label>
                            <input type="text" id="direccion" class="form-control" placeholder="Ej. Calle Valparaíso 123">
                            <div class="error-feedback" id="error-direccion"></div>
                        </div>

                        <div class="row">
                            <div class="col-12 mb-2">
                                <button type="submit" id="btn-submit" class="btn btn-primary w-100 py-2 fs-5">Guardar Cuenta</button>
                            </div>
                            <div class="col-12">
                                <button type="button" id="btn-cancel" class="btn btn-secondary w-100 py-2 d-none">Cancelar Edición</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Columna Derecha: Listado de Usuarios (col-12 col-lg-8) -->
            <div class="col-12 col-lg-8 mb-4">
                <div class="contact-card p-4">
                    <h3 class="mb-4 text-emerald" style="font-family: var(--font-heading);">Usuarios Registrados</h3>
                    
                    <div class="table-responsive" style="max-height: 560px; overflow-y: auto;">
                        <table class="table table-dark table-hover align-middle" style="font-size: 0.9rem;">
                            <thead>
                                <tr>
                                    <th scope="col">Nombre Completo</th>
                                    <th scope="col">Usuario</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Fecha Nac.</th>
                                    <th scope="col">Rol</th>
                                    <th scope="col" class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="users-items-body">
                                <!-- Se inyectará dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Contenedor para Footer Dinámico -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica global y de admin -->
    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
